name: Test

# Fast checks (format, vet, build, tests) on every push and pull request across
# all branches. The Docker workflow additionally re-runs vet + tests as a gate so
# a broken image is never pushed; this workflow gives a standalone status check
# and covers branches/PRs that don't trigger an image build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres for the tests that need a database (CASHFLOW_TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: cashflow
          POSTGRES_DB: cashflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cashflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        env:
          CASHFLOW_TEST_DATABASE_URL: postgres://cashflow:cashflow@localhost:5432/cashflow_test?sslmode=disable
        run: go test -race ./...
