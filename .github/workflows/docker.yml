name: Docker

# Build the app image and push it to Docker Hub.
on:
  push:
    branches: [main]      # change if your default branch isn't "main"
    tags: ['v*']          # pushing a tag like v1.2.0 publishes that version
  workflow_dispatch:       # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  # Gate the image on vet + tests so a broken build is never pushed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image repo on Docker Hub: <your-username>/cashflow. Rename "cashflow" if desired.
          images: ${{ secrets.DOCKER_USERNAME }}/cashflow
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64   # add linux/arm64 here (+ a setup-qemu-action step) for multi-arch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
