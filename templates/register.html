{{define "title"}}Daftar &mdash; Cashflow{{end}}
{{define "content"}}
<section class="card authcard">
  <h1>Buat akun</h1>
  <p class="muted">Dengan akun, cashplan Anda tersimpan dan tautan kelolanya tidak akan hilang.</p>
  {{if .Data.Err}}<div class="alert error">{{.Data.Err}}</div>{{end}}
  <form method="post" action="/register" class="stack">
    <label>Nama pengguna <span class="muted">(huruf kecil, angka, garis bawah)</span>
      <input type="text" name="username" value="{{.Data.Username}}" placeholder="cth: budi_kas" minlength="3" maxlength="30" required autofocus autocapitalize="none" spellcheck="false">
    </label>
    <label>Kata sandi <span class="muted">(min. 8 karakter)</span>
      <input type="password" name="password" minlength="8" required>
    </label>
    <label>Ulangi kata sandi
      <input type="password" name="password2" minlength="8" required>
    </label>
    <button type="submit" class="btn primary">Daftar</button>
  </form>
  <p class="muted small">Sudah punya akun? <a href="/login">Masuk di sini</a>.</p>
</section>
{{end}}
