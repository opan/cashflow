services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
      POSTGRES_DB: cashflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    # Optional .env in the project root (e.g. Nextcloud creds). Not required.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://cashflow:cashflow@db:5432/cashflow?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
